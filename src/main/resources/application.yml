spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: simplecar-api
  datasource:
    url: jdbc:mysql://localhost:3306/simplecar?useTimezone=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${ENV_MYSQL_USER}
    password: ${ENV_MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
server:
  servlet:
    context-path: /
  error:
    include-stacktrace: never
file:
  upload-dir: ./uploads